name: Enforce PR Checkboxes
on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-pr-checkboxes:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body for unchecked boxes
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prBody = context.payload.pull_request.body || "";
            const unchecked = (prBody.match(/- \[ \]/g) || []).length;

            if (unchecked > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `❌ Please complete all checklist items in the PR template before this can be merged. ${unchecked} incomplete.`
              });
              throw new Error("PR checklist incomplete.");
            }
