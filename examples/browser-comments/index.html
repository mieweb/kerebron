<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comments</title>
    <style>
      @import '@kerebron/editor/assets/index.css';
      @import '@kerebron/editor-kits/assets/AdvancedEditorKit.css';
      [data-comment-id] {
        background: #ff000080;
      }
    </style>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/bootstrap-dark-5@1.1.3/dist/css/bootstrap-night.min.css"
      media="(prefers-color-scheme: dark)"
    />
  </head>
  <body>
    <div class="d-flex">
      <div class="flex-fill w-50">
        <div id="editor"></div>
      </div>
      <div class="flex-fill w-50">
        <button class="btn btn-sm btn-primary" id="addComment">Add comment</button>
        <ul id="comments">
        </ul>

        <button class="btn btn-sm btn-primary" id="addSnapshot">Add snapshot</button>
        <button class="btn btn-sm btn-secondary" id="resetYSnapshot">Reset snapshot</button>
        <ul id="snapshots">
        </ul>
      </div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
