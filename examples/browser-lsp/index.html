<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LSP Test</title>
    <style>
      @import '@kerebron/editor/assets/index.css';
      @import '@kerebron/editor-kits/assets/AdvancedEditorKit.css';
    </style>
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="https://cdn.jsdelivr.net/npm/bootstrap-dark-5@1.1.3/dist/css/bootstrap-night.min.css"
      media="(prefers-color-scheme: dark)"
    />
  </head>
  <body>
    <div class="d-flex flex-row" style="height: 85vh">
      <div class="flex-fill w-50">
        <div id="editor" spellcheck="false"></div>
      </div>
      <div class="flex-fill w-50">
        <div>
          <h5>Markdown</h5>
          <pre id="markdown"></pre>
        </div>
      </div>
    </div>

    <script defer type="module" src="./src/main.ts"></script>
    <style>
    .md-selected {
      background: #FF000066;
      outline: #FF000066 1px solid;
    }

    :host {
      position: relative;
    }
    </style>

</html>
